[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "label-free-bench"
version = "1.0.0"
description = "A normal-only model-selection benchmark for anomaly detection"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["anomaly-detection", "benchmark", "model-selection", "unsupervised-learning"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "labelfree>=1.0,<2",
  "numba>=0.61",
  "numpy>=1.26",
  "pyod>=2.0,<2.1",
  "pyyaml>=6",
  "scikit-learn>=1.5",
  "scipy>=1.13",
]

[project.scripts]
label-free-bench = "label_free_bench.cli:main"

[project.urls]
Repository = "https://github.com/OliverHennhoefer/label-free-bench"
Issues = "https://github.com/OliverHennhoefer/label-free-bench/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/label_free_bench"]

[tool.hatch.build.targets.wheel.force-include]
"src/label_free_bench/datasets.json" = "label_free_bench/datasets.json"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
