name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      # Exercise the held-out sandbox exactly as heldout.yml sets it up.
      - run: |
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin candidate
          sudo chmod o+x "$HOME" "$(dirname "$GITHUB_WORKSPACE")"
      - run: pytest
        env:
          LABFREE_TEST_SANDBOX: sudo -n unshare --net -- setpriv --reuid=candidate --regid=candidate --clear-groups --
      - run: python -m benchmarks check-memory
